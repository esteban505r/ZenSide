<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZenSide | Crear Cuenta</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="responsive/auth-responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- IZQUIERDA -->

            <section class="auth-left">

                <div class="logo">

                    <div><a href="index.html"><img src="images/Logo.png" alt=""></div></a>

                </div>

                <div class="welcome-image">

                    <img src="images/Panda.png"
                        alt="Registro ZenSide">

                </div>

                <div class="welcome-text">

                    <h1>
                        ¡Únete a ZenSide!
                    </h1>

                    <p>
                        Crea tu cuenta y comienza a explorar
                        recursos, posturas y actividades para
                        acompañar a los pequeños yoguis.
                    </p>

                </div>

            </section>

            <!-- DERECHA -->

            <section class="auth-right">

                <div class="auth-card">

                    <h2>
                        Crear Cuenta
                    </h2>

                    <form id="registerForm">

                        <!-- NOMBRE -->

                        <div class="input-group">

                            <label>
                                Nombre Completo
                            </label>

                            <div class="input-box">

                                <i class="fa-regular fa-user"></i>

                                <input
                                    type="text"
                                    id="registerName"
                                    placeholder="Ingresa tu nombre"
                                    required>

                            </div>

                        </div>

                        <!-- EMAIL -->

                        <div class="input-group">

                            <label>
                                Correo Electrónico
                            </label>

                            <div class="input-box">

                                <i class="fa-regular fa-envelope"></i>

                                <input
                                    type="email"
                                    id="registerEmail"
                                    placeholder="correo@ejemplo.com"
                                    required>

                            </div>

                        </div>

                        <!-- PASSWORD -->

                        <div class="input-group">

                            <label>
                                Contraseña
                            </label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="registerPassword"
                                    placeholder="********"
                                    required>

                            </div>

                        </div>

                        <!-- CONFIRMAR PASSWORD -->

                        <div class="input-group">

                            <label>
                                Confirmar Contraseña
                            </label>

                            <div class="input-box">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="********"
                                    required>

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="auth-btn">

                            Crear Cuenta

                            <i class="fa-solid fa-user-plus"></i>

                        </button>

                        <p class="auth-link">

                            ¿Ya tienes una cuenta?

                            <a href="login.html">
                                Iniciar Sesión
                            </a>

                        </p>

                        <div id="registerMessage"></div>

                    </form>

                </div>

            </section>

        </div>

    </main>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>

</body>
</html>
